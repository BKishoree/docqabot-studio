name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets are used by any job. All OpenAI traffic goes to the local stub.
env:
  STUDIO_TESTS_REQUIRE_APP: "1"

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docqabot
          POSTGRES_PASSWORD: docqabot_test
          POSTGRES_DB: docqabot_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docqabot -d docqabot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://docqabot:docqabot_test@127.0.0.1:5434/docqabot_test?options=-c%20ivfflat.probes%3D100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # T-R1 needs the core-baseline tag and history
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-studio.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-studio.txt -r requirements-dev.txt
      - name: Unit
        run: python -m pytest tests/unit
      - name: Regression
        run: python -m pytest tests/regression
      - name: Contract
        run: python -m pytest tests/contract
      - name: Integration
        run: python -m pytest tests/integration

  frontend:
    name: frontend (typecheck, lint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    name: container (image, demo stack, smoke, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose -f compose.yaml -f compose.demo.yaml build
      - name: Start demo stack
        run: docker compose -f compose.yaml -f compose.demo.yaml up -d --wait --wait-timeout 180
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Smoke
        run: python tests/smoke/smoke.py --base-url http://127.0.0.1:8000
      - name: Data survives app container replacement
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"title":"ci-persistence"}' \
            http://127.0.0.1:8000/api/v1/conversations
          docker compose -f compose.yaml -f compose.demo.yaml up -d --force-recreate --no-deps --wait app
          curl -fsS http://127.0.0.1:8000/api/v1/conversations | grep -q ci-persistence
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.demo.yaml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f compose.yaml -f compose.demo.yaml down -v

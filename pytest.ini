[pytest]
testpaths = tests
addopts = -ra --strict-markers
faulthandler_timeout = 240
markers =
    db: needs the test PostgreSQL (TEST_DATABASE_URL, default 127.0.0.1:5434/docqabot_test)
    app: needs studio.main:app (skipped until the backend delivers it unless STUDIO_TESTS_REQUIRE_APP=1)
    subprocess: starts the app or stub in a child process
    slow: takes more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
